# BoT-SORT with appearance re-ID (detector's own features), fixed camera so no motion compensation.
# Tuned for 15 fps: track_buffer 75 frames = 5 s memory.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 75
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
